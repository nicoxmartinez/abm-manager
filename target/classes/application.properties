spring.application.name=abm.manager
spring.banner.location=classpath:banner.txt
# Configuracion de la Base de Datos PostgreSQL
spring.datasource.url=${JDBC_POSTGRESQL_SALES}
spring.datasource.username=${POSTGRESQL_USER_SALES}
spring.datasource.password=${POSTGRESQL_PASSWORD_SALES}
spring.datasource.driver-class-name=org.postgresql.Driver
# Configuracion de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Configuracion del servidor Tomacat
server.port=8035
server.servlet.context-path=/abm-manager/api
